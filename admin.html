<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Painel de administração do site romântico">
  <meta name="theme-color" content="#e91e63">
  <title>Administração - Nosso Amor ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container">
    <div class="header-content">
      <a href="./index.html" class="logo">💕 Nosso Amor</a>
      <nav>
        <a href="./index.html">Início</a>
        <a href="./galeria.html">Galeria</a>
        <a href="./admin.html" class="active">Admin</a>
        <button class="theme-toggle" id="themeToggle">🌙</button>
      </nav>
    </div>
  </div>
</header>

<main class="container">

<section id="adminDashboard">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--spacing-lg);">
<h1>Painel de Administração ⚙️</h1>
<button id="logoutBtn" class="btn btn-outline">Sair</button>
</div>

<!-- CONFIGURAÇÕES -->
<div class="admin-section">
<h3>⚙️ Configurações</h3>
<form id="configForm">

<div class="form-group">
<label for="coupleNameInput">Nome do Casal</label>
<input type="text" id="coupleNameInput" required>
</div>

<div class="form-row">
<div class="form-group">
<label for="startDateInput">Início do Relacionamento</label>
<input type="date" id="startDateInput" required>
</div>
<div class="form-group">
<label for="lastMeetInput">Última Vez que nos Vimos</label>
<input type="date" id="lastMeetInput" required>
</div>
<div class="form-group">
<label for="nextMeetInput">Próximo Encontro</label>
<input type="date" id="nextMeetInput" required>
</div>
</div>

<button type="submit" class="btn btn-primary">Salvar Configurações</button>
</form>
</div>

<!-- FOTOS -->
<div class="admin-section">
<h3>📷 Gerenciar Fotos</h3>
<form id="uploadForm">
<div class="form-group">
<label for="photoInput">Selecionar Foto</label>
<input type="file" id="photoInput" accept="image/*" required>
</div>
<button type="submit" class="btn btn-primary">Enviar Foto</button>
</form>

<h4 style="margin-top:var(--spacing-lg);">Fotos Existentes</h4>
<div class="admin-list" id="photosList"></div>
</div>

<!-- RECADINHOS -->
<div class="admin-section">
<h3>💌 Recadinhos</h3>
<h4>Pendentes</h4>
<div class="admin-list" id="pendingRecadinhosList"></div>

<h4 style="margin-top:var(--spacing-lg);">Todos</h4>
<div class="admin-list" id="allRecadinhosList"></div>
</div>

<!-- AGENDA -->
<div class="admin-section">
<h3>🗓️ Agenda</h3>

<form id="addAgendaForm">
<div class="form-group">
<label for="agendaTitleInput">Título</label>
<input type="text" id="agendaTitleInput" required>
</div>

<div class="form-group">
<label for="agendaDateInput">Data</label>
<input type="date" id="agendaDateInput" required>
</div>

<div class="form-group">
<label for="agendaMessageInput">Mensagem</label>
<textarea id="agendaMessageInput"></textarea>
</div>

<button type="submit" class="btn btn-primary">Adicionar</button>
</form>

<h4 style="margin-top:var(--spacing-lg);">Datas Especiais</h4>
<div class="admin-list" id="agendaList"></div>
</div>

<!-- BACKUP -->
<div class="admin-section">
<h3>💾 Backup</h3>

<button id="exportBtn" class="btn btn-secondary">Exportar JSON</button>
<input type="file" id="importFile" accept=".json" style="display:none;">
<button id="importBtn" class="btn btn-secondary">Importar JSON</button>
</div>

<div class="admin-section">
<h3>🎁 Surpresa</h3>
<a href="surpresa.html" class="btn btn-primary">Abrir Surpresa</a>
</div>

</section>
</main>

<footer>
<p>&copy; 2024 Nosso Amor ❤️</p>
</footer>
<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="pages/admin.js"></script>

</body>
</html>
