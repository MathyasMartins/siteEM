<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login do site romântico">
  <meta name="theme-color" content="#e91e63">
  <title>Login - Nosso Amor ❤️</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <a href="./index.html" class="logo">💕 Nosso Amor</a>
        <nav>
          <a href="./login.html" class="active">Login</a>
          <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero login-card">
      <h1>Entrar no nosso cantinho ❤️</h1>
      <p>Faça login para acessar o site.</p>
      <form id="loginForm" style="max-width:460px;margin:0 auto;">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="seuemail@exemplo.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" type="password" placeholder="Sua senha" required>
        </div>
        <button class="btn btn-primary btn-large" type="submit" style="width:100%;">Entrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Nosso Amor. Feito com ❤️ para você.</p>
  </footer>

  <script src="script.js"></script>
  <script src="pages/login.js"></script>
</body>
</html>
