<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - Nossa História ❤️">
    <meta name="theme-color" content="#e91e63">

    <title>Login ❤️</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>❤️</text></svg>">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">💕 Nossa História</a>
                <nav>
                    <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">

        <section class="recadinho-form" style="max-width: 500px; width: 100%;">
            <h2 class="text-center">Entrar 💖</h2>
            <p class="text-center" style="color: var(--text-secondary); margin-bottom: var(--spacing-lg);">
                Faça login para acessar nossa história
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-large">
                        Entrar ❤️
                    </button>
                </div>
            </form>

            <p id="loginError" class="text-center" style="color: red; margin-top: var(--spacing-md); display: none;">
                Email ou senha inválidos
            </p>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Nosso Amor. Feito com ❤️ Para Eternizar Nossos Momentos.</p>
    </footer>

    <!-- Script Login -->
    <script>
        const supabase = window.supabase.createClient(
            "SUA_SUPABASE_URL",
            "SUA_SUPABASE_ANON_KEY"
        );

        const form = document.getElementById("loginForm");
        const errorText = document.getElementById("loginError");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                errorText.style.display = "block";
            } else {
                window.location.href = "index.html";
            }
        });
    </script>

</body>

</html>
